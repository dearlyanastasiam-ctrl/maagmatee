name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate proyek Android
        run: |
          mkdir /tmp/bk && cp -r lib pubspec.yaml /tmp/bk/
          flutter create --org id.maagmate --project-name maagmate --platforms android .
          rm -rf lib && cp -r /tmp/bk/lib lib
          cp /tmp/bk/pubspec.yaml pubspec.yaml
          rm -rf test

      - name: Patch izin & alarm Android
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: maagmate-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Buat link download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MaagMate v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk